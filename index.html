<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>読書メモ</title>
 <!-- 文字の形（Googleフォント） -->
   <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
  <!-- 見た目のファイル -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="wrap">

  <!-- 上：見出しと、タブ -->
  <header class="head">
    <div>
      <h1>読んだ内容を覚えるための読書メモ</h1>
    </div>
    <!-- タブ：data-panel に「どの画面を出すか」を書いておく -->
    <nav class="tabs">
      <button class="tab now" type="button" data-panel="write">書く</button>
      <button class="tab" type="button" data-panel="read">読み返す</button>
    </nav>
  </header>

  
  <!-- 今日の言葉（日めくり） -->
  <p class="today">
    <span id="today-text"></span>
    <span id="today-who"></span>
  </p>


  <!-- タブ「書く」の中身（now がついている画面だけが見える） -->
  <section class="panel now" id="write">
    <div class="form">
      <div class="row">
        <div class="field grow">
          <label for="title">本のタイトル</label>
          <input type="text" id="title" placeholder="例：好きを言語化する技術">
     </div>
          <div class="field grow">
          <label for="author">著者</label>
          <input type="text" id="author" placeholder="例：三宅香帆">
        </div>

     <div class="field when">
          <label for="date">読んだ日</label>
          <input type="date" id="date">
        </div>

    <div class="field kind">
          <span class="kind-label">読んだ形</span>
          <label><input type="radio" name="kind" value="紙の本" checked> 紙の本</label>
          <label><input type="radio" name="kind" value="Kindle"> Kindle</label>
        </div>
  
      </div>



      <!-- 4つの書く欄（2×2に並べる） -->
      <div class="fields">
      <div class="field tall">
        <div class="label-row">
          <label for="impress">ハイライト</label>
          <button class="mic" type="button" data-target="impress">話す</button>
        </div>
        <textarea id="impress" placeholder="心に残った一文や場面"></textarea>
      </div>

      <div class="field tall">
        <div class="label-row">
          <label for="discover">発見</label>
          <button class="mic" type="button" data-target="discover">話す</button>
        </div>
        <textarea id="discover" placeholder="書かれていないことに、気づいたこと"></textarea>
      </div>

      <div class="field tall">
        <div class="label-row">
          <label for="compare">比較</label>
          <button class="mic" type="button" data-target="compare">話す</button>
        </div>
        <textarea id="compare" placeholder="ほかの本や作品と、くらべてみると"></textarea>
      </div>

      <div class="field tall">
        <div class="label-row">
          <label for="question">質問</label>
          <button class="mic" type="button" data-target="question">話す</button>
        </div>
        <textarea id="question" placeholder="疑問に思ったこと、だれかに聞いてみたいこと"></textarea>
      </div>
      </div><!-- 4つの書く欄（ここまで） -->

      <button class="btn" id="save" type="button">書きとめる</button>
      <p id="reply"></p>
    </div>
  </section>

  <!-- タブ「読み返す」の中身：さがす欄と、カード -->
  <section class="panel" id="read">
    <!-- チャレンジ2：言葉でさがす -->
    <input type="search" id="search" placeholder="言葉でさがす（例：言語化）">

    <!-- メモのカードを並べるところ -->
    <div id="list"></div>

    <button class="link" id="clear" type="button">全部消す</button>
  </section>
</div>

<!-- jQuery（授業と同じファイル） -->
<script src="js/jquery-2.1.3.min.js"></script>
<script>
// =====================================================
// ここから「今回習った範囲」
// =====================================================

// ===== 1. 箱（配列）を用意して、引き出し（localStorage）から取り出す =====
let records = [];
const saved = localStorage.getItem("dokusho");
if (saved) {
  records = JSON.parse(saved);   // 文字（JSON）を、箱（配列）にもどす
}

// 前に書いたメモには date がないので、day の文字から作る
// 例： "2026年9月4日（金）" → "2026-09-04"
for (let i = 0; i < records.length; i++) {
  const r = records[i];
  if (!r.date) {
    const y = r.day.split("年")[0];                                    // "2026"
    const m = r.day.split("年")[1].split("月")[0].padStart(2, "0");    // "9" → "09"
    const d = r.day.split("月")[1].split("日")[0].padStart(2, "0");    // "4" → "04"
    r.date = y + "-" + m + "-" + d;                                    // "2026-09-04"
  }
}

// 箱の中を、読んだ日の古い順に並べかえる（画面にはうしろから出すので、新しい日が上になる）
function sortByDate() {
  records.sort(function (a, b) {
    if (a.date < b.date) return -1;   // a のほうが古い → a を前に
    if (a.date > b.date) return 1;    // a のほうが新しい → a をうしろに
    return 0;                         // 同じ日 → 書きとめた順のまま
  });
}
sortByDate();   // ページを開いたときに、並べかえておく

// 曜日の配列（授業の Date と同じ）


const week = ["日", "月", "火", "水", "木", "金", "土"];


// 今日の言葉（読書についての、偉人の言葉）
const sayings = [
  { text: "本を読むことは、他人の考えを借りることだ。", who: "フランシス・ベーコン" },
  { text: "読書は心の糧である。", who: "セネカ" },
  { text: "本を読まない人は、考えることをやめた人である。", who: "アインシュタイン" },
  { text: "読書は、心の旅である。", who: "マルセル・プルースト" },
  { text: "本を読むことは、人生を豊かにする。", who: "オスカー・ワイルド" },
  { text: "読書は、知識の扉を開く鍵である。", who: "ジョン・ロック" },
  { text: "本を読むことは、他人の経験を自分のものにすることである。", who: "ヘレン・ケラー" },
  { text: "ひとり灯のもとに文をひろげて、見ぬ世の人を友とするぞ、こよなう慰むわざなる。", who: "吉田兼好『徒然草』" },
  { text: "読書とは、他人にものを考えてもらうことである。", who: "ショーペンハウアー『読書について』" },
  { text: "読書は豊かな人をつくり、話し合いは機転のきく人をつくり、書くことは正確な人をつくる。", who: "フランシス・ベーコン『随筆集』" },
  { text: "ある本は味見をし、ある本は飲みこみ、ごく少数の本は、よくかんで消化すべきである。", who: "フランシス・ベーコン『随筆集』" },
  { text: "良い本を読むことは、過去の時代のすぐれた人々と、語り合うようなものである。", who: "デカルト『方法序説』" },
  { text: "読書は、知識の材料を心に運ぶだけだ。読んだものを自分のものにするのは、考えることである。", who: "ジョン・ロック" },
  { text: "本は、私たちの内にある凍った海を砕く、斧でなければならない。", who: "カフカ（友人への手紙）" },
  { text: "読者はだれでも、読んでいるあいだ、自分自身を読んでいるのである。", who: "プルースト『見出された時』" },
  { text: "天国とは、図書館のようなところだろうと、私はずっと思っていた。", who: "ボルヘス" },
  { text: "遠くの国へ連れていってくれる船として、本にまさるものはない。", who: "エミリー・ディキンソン" },
  { text: "読書百遍、義おのずから見る。", who: "董遇（『三国志』魏志より）" },
  { text: "学びて思わざれば、すなわち罔し。思いて学ばざれば、すなわち殆し。", who: "孔子『論語』" },
  { text: "学びて時にこれを習う、また説ばしからずや。", who: "孔子『論語』" },
  { text: "書を読むこと万巻を破り、筆を下せば神あるがごとし。", who: "杜甫" },
  { text: "三日書を読まざれば、鏡に対して面目の憎むべきを覚ゆ。", who: "黄庭堅" },
  { text: "万巻の書を読むにあらざるよりは、いずくんぞ千秋の人たるを得ん。", who: "吉田松陰（松下村塾の聯）" },
  { text: "賢人と愚人との別は、学ぶと学ばざるとによりてできるものなり。", who: "福沢諭吉『学問のすゝめ』" },
  { text: "書を捨てよ、町へ出よう。", who: "寺山修司" },
  { text: "熊本より東京は広い。東京より日本は広い。日本より頭の中のほうが広いでしょう。", who: "夏目漱石『三四郎』（広田先生）" },
  { text: "精神的に向上心のないものは、ばかだ。", who: "夏目漱石『こころ』（K）" },
  { text: "人生は一行のボオドレエルにも若かない。", who: "芥川龍之介『或阿呆の一生』" },
  { text: "人生は一箱のマッチに似ている。重大に扱うのはばかばかしい。重大に扱わなければ危険である。", who: "芥川龍之介『侏儒の言葉』" },
  { text: "他人と同じものを読んでいれば、他人と同じ考え方しかできなくなる。", who: "村上春樹『ノルウェイの森』（永沢さん）" },
  { text: "完璧な文章などといったものは存在しない。完璧な絶望が存在しないようにね。", who: "村上春樹『風の歌を聴け』" },

];

const today = new Date();                                           // 今日
const start = new Date(2026, 0, 1);      //数えはじめの日                    // 数えはじめの日（2026年1月1日）
const days = Math.floor((today - start) / (1000 * 60 * 60 * 24));  // 何日たったか
const s = sayings[days % sayings.length];                           // 今日の言葉を取り出す

// 箱の0番目（いちばん最初）を取り出す
$("#today-text").text(s.text);    // 言葉を入れる
$("#today-who").text(s.who);      // だれの言葉かを入れる


// さがす言葉（空なら、全部出す）← チャレンジ2で使う
let word = "";

// 今直しているメモの番号（直していないときは null ＝ からっぽ）
let editing = null;


// ===== 2. カードを並べる =====
  function showList() {
   $("#list").html("");   // まず、いったん空にする
   let month = "";        // 今の入れ物が何月か（はじめは、からっぽ）

  // 新しいメモが上に来るように、うしろから順番に見ていく

  for (let i = records.length - 1; i >= 0; i--) {
    const r = records[i];

    // チャレンジ2：さがす言葉が入っていないメモは、とばす
          if (word != "" && !(r.title + r.author + r.impress + r.discover + r.compare + r.question).includes(word)) {
            continue;      
    }

    // 月が変わったら、新しい入れ物（開け閉めできる箱）を作る
    const ym = r.date.slice(0, 7);              // "2026-11-15" → "2026-11"
    if (ym != month) {
      month = ym;                               // 「今の入れ物は、この月」と覚える
      const y = ym.split("-")[0];               // "2026"
      const m = Number(ym.split("-")[1]);       // "11" → 11、"09" → 9（前の0をとる）
      $("#list").append('<details class="month" open><summary>' + y + '年' + m + '月</summary><div class="cards"></div></details>');
    }

    let html = '<div class="card" data-index="' + i + '">';


     html += '<p class="meta"><span class="book">' + r.title + '</span>';
    if (r.author) {
      html += '<span class="author">' + r.author + '</span>';
    }
    if (r.kind) {
      html += '<span class="kind-tag">' + r.kind + '</span>';
    }
    html += '</p>';
    html += '<div class="body">';   // ← 開くと見える中身（ここから）

    if (r.impress != "") {
      html += '<p class="item"><span class="tag">ハイライト</span>' + r.impress + '</p>';
    }
    if (r.discover != "") {
      html += '<p class="item"><span class="tag">発見</span>' + r.discover + '</p>';
    }
    if (r.compare != "") {
      html += '<p class="item"><span class="tag">比較</span>' + r.compare + '</p>';
    }
        if (r.question != "") {
      html += '<p class="item"><span class="tag">質問</span>' + r.question + '</p>';
    }
    html += '</div>';               // ← 開くと見える中身（ここまで）
    html += '<p class="date">' + r.day + '</p>';
    html += '<div class="buttons">';
    html += '<button class="toggle" type="button">開く</button>';
    html += '<button class="edit" type="button">直す</button>';
    html += '<button class="delete" type="button">消す</button>';
    html += '</div>';

    html += '</div>';
       $("#list .cards").last().append(html);   // いちばん最後に作った入れ物に、カードを足す

    　}
}

showList();   // ページを開いたときに、しまってあったメモを並べる
// ===== 「読んだ日」の欄に、今日の日付を入れておく =====
function setToday() {
  const t = new Date();
  const m = String(t.getMonth() + 1).padStart(2, "0");   // 月を2けたに（11 → "11"、5 → "05"）
  const d = String(t.getDate()).padStart(2, "0");        // 日を2けたに
  $("#date").val(t.getFullYear() + "-" + m + "-" + d);   // 「2026-11-18」の形で入れる
}
setToday();
// ===== 3. 「書きとめる」を押したとき =====
$("#save").on("click", function () {
  const title = $("#title").val();
  const author = $("#author").val();
  const kind = $('input[name="kind"]:checked').val();   // 選ばれている方の value を取り出す
  const impress = $("#impress").val();
  const discover = $("#discover").val();
  const compare = $("#compare").val();
  const question = $("#question").val();

  if (title == "") {
    $("#reply").html("本のタイトルを書いてください。");
    return;
  }
  // 4つとも空なら、何もしない
  if (impress == "" && discover == "" && compare == "" && question == "") {
    $("#reply").html("どれか1つ、書いてください。");
    return;
  }

  // 今日の日付をつくる
  const now = new Date($("#date").val() + "T00:00");   // 欄で選んだ日を使う
  const day = now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日（" + week[now.getDay()] + "）";

  // 1つ分を、ひとつの荷物（オブジェクト）にまとめて、箱に入れる
  const record = {
    day: day,
    date: $("#date").val(),   // 比べるための日付（「2026-11-15」の形）
    title: title,
    author: author,
    kind: kind,
    impress: impress,
    discover: discover,
    compare: compare,
    question: question
  };
   if (editing === null) {
    // 新しいメモ → 箱のうしろに足す
    records.push(record);
    $("#reply").html("書きとめました。「読み返す」タブで見られます。");
  } else {
    // 直しているメモ → 同じ場所に上書きする
    record.day = records[editing].day;   // 日付は、元のメモのままにする
    record.date = records[editing].date; // 比べるための日付も、元のままにする
    records[editing] = record;
    editing = null;                      // 直しおわったので、からっぽにもどす
    $("#reply").html("直しました。「読み返す」タブで見られます。");
  }

  sortByDate();   // 前の日付のメモを書いても、正しい場所に入るように並べかえる

  // 箱を文字（JSON）にして、引き出しにしまう
  localStorage.setItem("dokusho", JSON.stringify(records));


  // タイトルは残して（同じ本を続けて書くことが多いので）、ほかの欄を空にする
  $("#impress").val("");
  $("#discover").val("");
  $("#compare").val("");
  $("#question").val("");

  showList();
});

// ===== 4. 「全部消す」を押したとき（確認の小窓つき）=====
$("#clear").on("click", function () {
  if (!confirm("本当に全部消しますか？\n消したメモは、元に戻せません。")) {
    return;   // 「キャンセル」なら、ここで終わり
  }
  localStorage.removeItem("dokusho");
  records = [];
  editing = null;   // 直している途中でも、からっぽにもどす
  showList();
  $("#reply").html("全部消しました。");
});

// ===== 5. 「開く」を押したとき（思い出してから、中身を見る）=====
// カードはあとから作られるので、最初からある #list に見はってもらう
$("#list").on("click", ".toggle", function () {
  const card = $(this).closest(".card");   // 押したボタンが入っているカード
  card.toggleClass("open");                // open がなければつける、あればはずす
  if (card.hasClass("open")) {
    $(this).text("閉じる");
  } else {
    $(this).text("開く");
  }
});

// ===== 6. タブを押したとき（書く ⇔ 読み返す を切りかえる）=====
$(".tab").on("click", function () {
  const panel = $(this).attr("data-panel");   // どの画面を出すか（write / read）

  $(".tab").removeClass("now");     // いったん、全部のタブから now をはずして
  $(this).addClass("now");          // 押したタブにだけ now をつける

  $(".panel").removeClass("now");   // 画面も同じ。全部から now をはずして
  $("#" + panel).addClass("now");   // 出したい画面にだけ now をつける
  $("#reply").html("");             // 画面を切りかえたら、お知らせを消す
});

// ===== 7. また書きはじめたら、お知らせを消す =====
$("#write").on("input", "input, textarea", function () {
  $("#reply").html("");
});


// ===== 8. 「直す」を押したとき（中身を「書く」画面にもどす）=====
$("#list").on("click", ".edit", function () {
  const i = $(this).closest(".card").attr("data-index");   // 押されたカードの番号
  const r = records[i];                                     // その番号のメモを取り出す

  // メモの中身を、それぞれの欄に入れる
  $("#title").val(r.title);
  $("#author").val(r.author || "");
  $('input[name="kind"][value="' + r.kind + '"]').prop("checked", true);
  $("#impress").val(r.impress);
  $("#discover").val(r.discover);
  $("#compare").val(r.compare);
  $("#question").val(r.question);

  editing = i;   // 「今は i 番目を直している」と覚えておく

  $('.tab[data-panel="write"]').click();   // 「書く」タブを押したことにする
  $("#reply").html("「" + r.title + "」のメモを直しています。");
});


// ===== 10. 「消す」を押したとき（1枚だけ消す・確認の小窓つき）=====
$("#list").on("click", ".delete", function () {
  const i = $(this).closest(".card").attr("data-index");   // 押されたカードの番号
  const r = records[i];                                     // その番号のメモ

  if (!confirm("「" + r.title + "」のメモを1枚消しますか？\n消したメモは、元に戻せません。")) {
    return;   // 「キャンセル」なら、ここで終わり
  }

  records.splice(i, 1);                                     // 箱の i 番目から、1つだけ取りのぞく
  localStorage.setItem("dokusho", JSON.stringify(records)); // 減った箱を、引き出しにしまいなおす
  editing = null;                                           // 直している途中でも、からっぽにもどす
  showList();                                               // カードを並べなおす
});


// ===== 9. 本のタイトルを押したとき（その本のメモだけを並べる）=====

$("#list").on("click", ".book", function () {
  word = $(this).text();      // 押されたタイトルの文字を、さがす言葉にする
  $("#search").val(word);     // さがす欄にも、同じ文字を出しておく
  showList();                 // カードを並べなおす
});



// =====================================================
// ここから「チャレンジ」
// =====================================================

// ===== チャレンジ1：音声入力（話すと、その欄に文字が入る）=====
// Chrome に入っている「声を文字にする道具」
const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;

let rec = null;   // 今聞いている道具（聞いていないときは null ＝ からっぽ）

$(".mic").on("click", function () {
  const btn = $(this);
  const target = btn.attr("data-target");   // どの欄に入れるか（impress / discover / compare / question）

  if (!Speech) {
    $("#reply").html("このブラウザでは、音声入力が使えません。Chrome で開いてください。");
    return;
  }

  // もう聞いているときに押したら、止める
  if (rec) {
    rec.stop();
    return;
  }

  rec = new Speech();
  rec.lang = "ja-JP";                       // 日本語で聞きとる
  rec.continuous = true;                    // 止めるまで、聞きつづける
  const before = $("#" + target).val();     // 話す前に入っていた文字を、覚えておく

  rec.onresult = function (e) {             // 聞きとれたら（何回も来る）
    let text = "";
    for (let i = 0; i < e.results.length; i++) {   // これまでに聞きとった文を、全部つなげる
      text += e.results[i][0].transcript;
    }
    text = text.replaceAll(" ", "");        // 半角スペースを消す
    $("#" + target).val(before + text);     // 「前の文字 ＋ 聞きとった文ぜんぶ」で置きかえる
  };

  rec.onend = function () {                 // 止まったら
    btn.removeClass("on");
    btn.text("話す");                       // ボタンの文字をもどす
    rec = null;                             // からっぽにもどす
  };

  btn.addClass("on");
  btn.text("止める");                       // 聞いているあいだは「止める」にする
  rec.start();                              // 聞きはじめる
});


// ===== チャレンジ2：言葉でさがす（1文字打つたびに動く）=====
$("#search").on("input", function () {
  word = $(this).val();
  showList();
});
